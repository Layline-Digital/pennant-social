<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pennant Hoist — Operations Deck</title>
  <style>
    :root {
      --bg: #0b132b;
      --card-bg: #1c2541;
      --border: #3a506b;
      --accent: #48cae4;
      --text: #ffffff;
      --text-muted: #8d99ae;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow-x: auto;
      overflow-y: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #080d1e;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      font-size: 14px;
      color: var(--accent);
    }
    .status-badge {
      font-size: 11px;
      background: rgba(72, 202, 228, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    #deck-container {
      flex: 1;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      padding: 14px;
      gap: 14px;
    }
    .deck-column {
      flex: 0 0 340px;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      scroll-snap-align: start;
    }
    .column-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.2);
    }
    .column-title {
      font-size: 13px;
      font-weight: 600;
    }
    .column-proto {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .cards-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .post-author {
      font-weight: 600;
      color: var(--text);
    }
    .btn-compose {
      background: var(--accent);
      color: #0b132b;
      border: none;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🚩</span>
      <span>PENNANT HOIST</span>
      <span class="status-badge" id="net-status">STREAM LIVE</span>
    </div>
    <button class="btn-compose" id="btn-broadcast">+ New Broadcast</button>
  </header>
  <div id="deck-container"></div>

  <script>
    const container = document.getElementById('deck-container');
    const profiles = [
      { id: 'bsky_main', label: '@pennant.laylinedigital.com', protocol: 'bluesky', type: 'Timeline' },
      { id: 'masto_signal', label: '@signal@social.pennant', protocol: 'mastodon', type: 'Notifications' },
      { id: 'nostr_relay', label: 'Relay Pool (damus.io)', protocol: 'nostr', type: 'Feed' },
      { id: 'queue_col', label: 'Outbox Queue', protocol: 'matrix', type: 'Scheduled' }
    ];

    profiles.forEach(p => {
      const col = document.createElement('div');
      col.className = 'deck-column';
      col.innerHTML = `
        <div class="column-header">
          <div>
            <div class="column-title">${p.label}</div>
            <div class="column-proto">${p.protocol} • ${p.type}</div>
          </div>
          <span style="font-size: 11px; color: var(--accent);">●</span>
        </div>
        <div class="cards-list">
          <div class="post-card">
            <div class="post-header">
              <span class="post-author">${p.label}</span>
              <span>just now</span>
            </div>
            <div>Multi-protocol sovereign listener connected via StreamHub SSE.</div>
          </div>
        </div>
      `;
      container.appendChild(col);
    });

    document.getElementById('btn-broadcast').addEventListener('click', () => {
      const msg = prompt('Enter message to broadcast across active fleet profiles:');
      if (msg) {
        fetch('/api/ingest/broadcast', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (localStorage.getItem('PENNANT_KEY') || 'ps_ingest_dev_key')
          },
          body: JSON.stringify({
            profileId: 'pennant',
            message: msg,
            targets: ['mastodon', 'bluesky', 'nostr']
          })
        }).then(r => r.json()).then(res => {
          alert('Broadcast enqueued successfully! Queue ID: ' + res.queueId);
        }).catch(err => alert('Failed: ' + err.message));
      }
    });
  </script>
</body>
</html>

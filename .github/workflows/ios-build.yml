name: iOS Mobile Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/hoist-desktop/**'
      - 'apps/hoist-web/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build iOS Native Shell
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify Xcode 16+
        run: |
          xcodebuild -version

      - name: Install Rust Stable & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install Monorepo & Web Dependencies
        run: |
          npm ci
          cd apps/hoist-web && npm ci

      - name: Build Svelte Production Distribution
        run: |
          cd apps/hoist-web && npm run build

      - name: Initialize Tauri iOS Project
        working-directory: apps/hoist-desktop
        run: |
          npx @tauri-apps/cli ios init

      - name: Build Tauri iOS Simulator Package
        working-directory: apps/hoist-desktop
        run: |
          npx @tauri-apps/cli ios build --target aarch64-apple-ios-sim --ci

      - name: Archive iOS Build Output
        uses: actions/upload-artifact@v4
        with:
          name: pennant-ios-bundle
          path: |
            apps/hoist-desktop/src-tauri/gen/apple/build/**/*.app
            apps/hoist-desktop/src-tauri/target/aarch64-apple-ios-sim/release/*.app
          if-no-files-found: warn

name: iOS TestFlight Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable & iOS Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Monorepo & Web Dependencies
        run: |
          npm ci
          cd apps/hoist-web && npm ci

      - name: Build Svelte Production Distribution
        run: |
          cd apps/hoist-web && npm run build

      - name: Configure Apple API Private Key
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          P8_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$KEY_CONTENT" > "$P8_PATH"
          cp "$P8_PATH" "$HOME/.private_keys/"
          chmod 600 "$P8_PATH" "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$P8_PATH" >> $GITHUB_ENV

      - name: Initialize Tauri iOS Workspace
        working-directory: apps/hoist-desktop
        run: |
          npx @tauri-apps/cli ios init

      - name: Build and Package Signed IPA
        working-directory: apps/hoist-desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx @tauri-apps/cli ios build --export-method app-store-connect

      - name: Upload IPA to TestFlight
        working-directory: apps/hoist-desktop
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          IPA_PATH=$(find src-tauri/gen/apple/build -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "[-] Error: Could not locate built .ipa file in src-tauri/gen/apple/build"
            find src-tauri/gen/apple -name "*.ipa"
            exit 1
          fi
          echo "[+] Located IPA at: $IPA_PATH"
          echo "[*] Transmitting build to App Store Connect / TestFlight..."
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          echo "[+] Upload to TestFlight completed successfully!"

      - name: Archive Production IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pennant-testflight-ipa
          path: apps/hoist-desktop/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn


name: iOS Mobile Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/hoist-desktop/**'
      - 'apps/hoist-web/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build iOS Native Shell
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install Monorepo & Web Dependencies
        run: |
          npm ci
          cd apps/hoist-web && npm ci

      - name: Build Svelte Production Distribution
        run: |
          cd apps/hoist-web && npm run build

      - name: Initialize Tauri iOS Project
        working-directory: apps/hoist-desktop
        run: |
          npx @tauri-apps/cli ios init

      - name: Build Tauri iOS Package
        working-directory: apps/hoist-desktop
        run: |
          npx @tauri-apps/cli ios build --ci

      - name: Archive iOS Build Output
        uses: actions/upload-artifact@v4
        with:
          name: pennant-ios-bundle
          path: apps/hoist-desktop/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn

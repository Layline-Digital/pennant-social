name: iOS TestFlight Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable & iOS Device Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Monorepo & Web Dependencies
        run: |
          npm ci
          cd apps/hoist-web && npm ci

      - name: Build Svelte Production Distribution
        run: |
          cd apps/hoist-web && npm run build

      - name: Initialize Tauri iOS Workspace
        working-directory: apps/hoist-desktop
        run: |
          npx @tauri-apps/cli ios init

      - name: Configure Apple API Private Key
        if: env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Build and Package Signed IPA for TestFlight
        working-directory: apps/hoist-desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx @tauri-apps/cli ios build --target aarch64 --export-method app-store-connect

      - name: Archive Production IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pennant-testflight-ipa
          path: apps/hoist-desktop/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient & Grid -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073d79" />
      <stop offset="50%" stop-color="#084487" />
      <stop offset="100%" stop-color="#063264" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Deep Blue Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Subtle Navigation Arcs (Laylines) -->
  <circle cx="250" cy="200" r="160" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
  <circle cx="250" cy="200" r="230" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.06" stroke-dasharray="6 6" />
  <line x1="40" y1="200" x2="460" y2="200" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" />
  <line x1="250" y1="20" x2="250" y2="380" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" />

  <!-- LOGO EMBLEM (Left: Centered at x=250, y=200) -->
  <!-- Diamond Frame with Open Corners -->
  <g stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" fill="none">
    <!-- Top-Right Edge -->
    <line x1="250" y1="75" x2="375" y2="200" />
    <!-- Bottom-Right Edge -->
    <line x1="375" y1="200" x2="265" y2="310" />
    <!-- Top-Left Edge -->
    <line x1="250" y1="75" x2="135" y2="190" />
    <!-- Bottom-Left Edge / Cutout Tail -->
    <line x1="165" y1="220" x2="250" y2="305" />
    <line x1="250" y1="305" x2="240" y2="315" />
  </g>

  <!-- Center Accent Bar (Golden-Yellow) -->
  <line x1="185" y1="200" x2="315" y2="200" stroke="#f6c343" stroke-width="6.5" stroke-linecap="round" />

  <!-- 'L' Monogram -->
  <path d="M 225 125 L 225 188 L 275 188" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- 'D' Monogram -->
  <path d="M 225 212 L 225 275 M 225 212 L 255 212 C 285 212 285 275 255 275 L 225 275" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="square" />

  <!-- WORDMARK: LAYLINE DIGITAL -->
  <!-- "LAYLINE" Bold White -->
  <text x="440" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="4">LAYLINE</text>

  <!-- "DIGITAL" Clean Light White -->
  <text x="775" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="300" fill="#ffffff" letter-spacing="6">DIGITAL</text>

  <!-- Underline Accent Rule -->
  <line x1="440" y1="252" x2="1110" y2="252" stroke="#f6c343" stroke-width="5" stroke-linecap="round" />
</svg>

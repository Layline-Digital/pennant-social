<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161c28" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#headerBg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  
  <!-- Subtle decorative technical lines -->
  <line x1="0" y1="420" x2="1500" y2="420" stroke="#1e2638" stroke-width="2"/>
  <line x1="120" y1="0" x2="120" y2="500" stroke="#1e2638" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1380" y1="0" x2="1380" y2="500" stroke="#1e2638" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Brand Text -->
  <text x="160" y="240" font-family="monospace" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="6">PENNANT HOIST</text>
  <text x="160" y="295" font-family="monospace" font-size="20" font-weight="700" fill="#2cee88" letter-spacing="3">// MULTI-PROTOCOL SOCIAL OPERATIONS DECK</text>
  <text x="160" y="340" font-family="sans-serif" font-size="16" fill="#8899ac">ATProto (Bluesky) • ActivityPub (Mastodon) • Nostr NIP-01</text>
  
  <!-- Right-side status beacon -->
  <circle cx="1320" cy="235" r="8" fill="#2cee88"/>
  <text x="1300" y="240" font-family="monospace" font-size="13" font-weight="700" fill="#2cee88" text-anchor="end">SYS_ONLINE</text>
</svg>